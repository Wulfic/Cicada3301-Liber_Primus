name: 'Contributors'

# A merged pull request makes its author a contributor (CONTRIBUTORS.md).
# pull_request_target runs this file from main, and the PR's code is never checked out.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  add_contributor:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Add the PR author to CONTRIBUTORS.md
      env:
        LOGIN: ${{ github.event.pull_request.user.login }}
        PR: ${{ github.event.pull_request.number }}
      run: python3 tools/add_contributor.py --login "$LOGIN" --pr "$PR" --write

    - name: Commit if changed
      env:
        LOGIN: ${{ github.event.pull_request.user.login }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        if git diff --quiet -- CONTRIBUTORS.md; then
          echo "CONTRIBUTORS.md unchanged."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add CONTRIBUTORS.md
        git commit -m "docs(contributors): add @$LOGIN (#$PR)"
        git push origin HEAD:main
